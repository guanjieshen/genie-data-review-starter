name: Genie data review

on:
  pull_request:
    paths: ["databricks.yml", "resources/**", "src/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: genie-data-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: guanjieshen/genie_code_code_review_gh_action@v0
        with:
          databricks-host: ${{ vars.DATABRICKS_HOST }}
          client-id: ${{ vars.GENIE_REVIEWER_CLIENT_ID }}
          client-secret: ${{ secrets.GENIE_REVIEWER_CLIENT_SECRET }}
          bundle-target: staging
          # Optional: a workspace that serves the Genie Code model, if the target workspace does not.
          genie-host: ${{ vars.GENIE_MODEL_HOST }}
